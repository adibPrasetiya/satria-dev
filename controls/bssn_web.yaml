  # ===========================================================================
  - id: FILE
    nomor: 11
    nama: File
    kontrol:

      - id: FILE-11.1
        nomor_referensi: "11.1"
        uraian: "mengatur jumlah file untuk setiap pengguna dan kuota ukuran file yang diunggah"
        verifiabilitas: sebagian
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V12.1", "CWE-400" ]
        metode_pengujian:
          - id: FILE-11.1-T01
            nama: Batas ukuran file unggahan ditegakkan
            titik_uji: unggah_file
            jenis: semi_otomatis
            butuh_autentikasi: true
            profil: intrusif
            check_id: file.upload_size_limit
            parameter: { ukuran_maks_mb: 10 }    # TODO: sesuaikan per aset
            kriteria_lulus: File di atas batas ditolak server.
          - id: FILE-11.1-T02
            nama: Kuota jumlah file per pengguna
            titik_uji: dokumen
            jenis: manual
            engine: manual
            check_id: manual.upload_quota
            kriteria_lulus: Kuota jumlah/total ukuran per pengguna ditetapkan.
            bukti: [ dokumen ]

      - id: FILE-11.2
        nomor_referensi: "11.2"
        uraian: "melakukan validasi file sesuai dengan tipe konten yang diharapkan"
        verifiabilitas: sebagian
        severity_default: tinggi
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V12.2", "CWE-434" ]
        metode_pengujian:
          - id: FILE-11.2-T01
            nama: File tak berbahaya dengan tipe tidak sesuai ditolak
            titik_uji: unggah_file
            jenis: semi_otomatis
            butuh_autentikasi: true
            check_id: file.content_type_validation
            kriteria_lulus: Server memvalidasi isi file, bukan hanya ekstensi/Content-Type dari klien.

      - id: FILE-11.3
        nomor_referensi: "11.3"
        uraian: "melakukan pelindungan terhadap metadata input dan metadata file"
        verifiabilitas: sebagian
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V12.3", "CWE-22" ]
        metode_pengujian:
          - id: FILE-11.3-T01
            nama: Nama file dari pengguna tidak dipakai langsung
            titik_uji: unggah_file
            jenis: semi_otomatis
            butuh_autentikasi: true
            check_id: file.filename_sanitization
            kriteria_lulus: Server mengganti/menyanitasi nama file unggahan.
          - id: FILE-11.3-T02
            nama: Metadata sensitif dihapus dari file yang disajikan
            titik_uji: unduh_file
            check_id: file.metadata_stripped
            kriteria_lulus: File gambar/dokumen yang disajikan tidak memuat metadata sensitif (EXIF, penulis, path).

      - id: FILE-11.4
        nomor_referensi: "11.4"
        uraian: "melakukan pemindaian file yang diperoleh dari sumber yang tidak dipercaya"
        verifiabilitas: sebagian
        severity_default: tinggi
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V12.4.2" ]
        metode_pengujian:
          - id: FILE-11.4-T01
            nama: Unggahan file uji antivirus standar (EICAR) ditolak/dikarantina
            titik_uji: unggah_file
            jenis: semi_otomatis
            butuh_autentikasi: true
            check_id: file.av_scanning
            kriteria_lulus: File uji EICAR ditolak atau dikarantina.

      - id: FILE-11.5
        nomor_referensi: "11.5"
        uraian: "melakukan konfigurasi server untuk mengunduh file sesuai ekstensi yang ditentukan"
        verifiabilitas: otomatis
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V12.5", "CWE-552" ]
        metode_pengujian:
          - id: FILE-11.5-T01
            nama: Header unduhan aman
            titik_uji: unduh_file
            check_id: file.download_headers
            kriteria_lulus: Content-Disposition attachment dan X-Content-Type-Options nosniff pada unduhan.
          - id: FILE-11.5-T02
            nama: Hanya ekstensi yang diizinkan yang disajikan
            titik_uji: unduh_file
            engine: nuclei
            check_id: file.extension_allowlist
            kriteria_lulus: Berkas konfigurasi/sumber (mis. .bak, .config, .sql) tidak disajikan.

  # ===========================================================================
  - id: APIS
    nomor: 12
    nama: Keamanan API dan Web Service
    kontrol:

      - id: APIS-12.1
        nomor_referensi: "12.1"
        uraian: "melakukan konfigurasi layanan web"
        verifiabilitas: sebagian
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V13.1", "CWE-942" ]
        metode_pengujian:
          - id: APIS-12.1-T01
            nama: Kebijakan CORS tidak terlalu longgar
            titik_uji: api
            check_id: api.cors_policy
            kriteria_lulus: Origin tidak dipantulkan bebas; wildcard tidak dikombinasikan dengan credentials.
          - id: APIS-12.1-T02
            nama: Metode HTTP yang aktif sesuai kebutuhan
            titik_uji: api
            check_id: api.http_methods
            kriteria_lulus: TRACE dan metode yang tidak digunakan dinonaktifkan.

      - id: APIS-12.2
        nomor_referensi: "12.2"
        uraian: "memverifikasi uniform resource identifier API tidak menampilkan informasi yang berpotensi sebagai celah keamanan"
        verifiabilitas: otomatis
        severity_default: tinggi
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V13.1.3", "CWE-598" ]
        metode_pengujian:
          - id: APIS-12.2-T01
            nama: Tidak ada kredensial/token/data dikecualikan di URI
            titik_uji: api
            engine: zap
            check_id: api.sensitive_in_uri
            kriteria_lulus: URI tidak memuat API key, token, atau data dikecualikan.
          - id: APIS-12.2-T02
            nama: Dokumentasi API/endpoint debug tidak terbuka publik
            titik_uji: api
            engine: nuclei
            check_id: exposure.api_docs_debug
            kriteria_lulus: Swagger/OpenAPI/endpoint debug tidak dapat diakses tanpa otorisasi.

      - id: APIS-12.3
        nomor_referensi: "12.3"
        uraian: "membuat keputusan otorisasi"
        verifiabilitas: sebagian
        severity_default: kritis
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V13.1.4", "OWASP API1:2023", "OWASP API5:2023" ]
        metode_pengujian:
          - id: APIS-12.3-T01
            nama: Endpoint API mensyaratkan autentikasi
            titik_uji: api
            check_id: api.auth_required
            kriteria_lulus: Endpoint non-publik menolak request tanpa token (401).
          - id: APIS-12.3-T02
            nama: Otorisasi tingkat objek pada API
            titik_uji: api
            jenis: semi_otomatis
            butuh_autentikasi: true
            check_id: access.horizontal
            parameter: { akun_uji: [ "{{akun_uji_1}}", "{{akun_uji_2}}" ] }
            kriteria_lulus: Token akun A tidak dapat mengakses objek akun B.

      - id: APIS-12.4
        nomor_referensi: "12.4"
        uraian: "menampilkan metode RESTful hypertext transfer protocol apabila input pengguna dinyatakan valid"
        verifiabilitas: otomatis
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V13.2.1" ]
        metode_pengujian:
          - id: APIS-12.4-T01
            nama: Metode yang tidak didukung ditolak dengan benar
            titik_uji: api
            check_id: api.method_enforcement
            kriteria_lulus: Metode HTTP yang tidak sesuai endpoint menghasilkan 405, bukan diproses.

      - id: APIS-12.5
        nomor_referensi: "12.5"
        uraian: "menggunakan validasi skema dan verifikasi sebelum menerima input"
        verifiabilitas: sebagian
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V13.2.2" ]
        metode_pengujian:
          - id: APIS-12.5-T01
            nama: Payload tidak sesuai skema ditolak
            titik_uji: api
            jenis: semi_otomatis
            check_id: api.schema_validation
            parameter: { openapi_spec: "TODO: path/URL spesifikasi API per aset (opsional)" }
            kriteria_lulus: JSON rusak, tipe salah, atau field wajib hilang menghasilkan 400/422.
          - id: APIS-12.5-T02
            nama: Content-Type request diverifikasi
            titik_uji: api
            check_id: api.content_type_enforcement
            kriteria_lulus: Request dengan Content-Type tidak sesuai ditolak (415).

      - id: APIS-12.6
        nomor_referensi: "12.6"
        uraian: "menggunakan metode pelindungan layanan berbasis web"
        verifiabilitas: sebagian
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V13.2" ]
        metode_pengujian:
          - id: APIS-12.6-T01
            nama: Header keamanan pada respons API
            titik_uji: api
            check_id: headers.api_security_headers
            kriteria_lulus: Respons API memiliki Content-Type tepat, nosniff, dan Cache-Control sesuai.
          - id: APIS-12.6-T02
            nama: Perlindungan lapisan aplikasi (WAF/gateway)
            titik_uji: dokumen
            jenis: manual
            engine: manual
            check_id: manual.api_gateway_waf
            kriteria_lulus: Layanan dilindungi API gateway/WAF sesuai arsitektur.
            bukti: [ dokumen ]

      - id: APIS-12.7
        nomor_referensi: "12.7"
        uraian: "menerapkan kontrol antiotomatisasi"
        verifiabilitas: otomatis
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP API4:2023", "CWE-770" ]
        metode_pengujian:
          - id: APIS-12.7-T01
            nama: Pembatasan laju pada endpoint API
            titik_uji: api
            profil: intrusif
            check_id: access.rate_limit
            kriteria_lulus: Request berlebih dibatasi (HTTP 429 / header rate-limit).

  # ===========================================================================
  - id: CONF
    nomor: 13
    nama: Konfigurasi
    kontrol:

      - id: CONF-13.1
        nomor_referensi: "13.1"
        uraian: "mengonfigurasi server sesuai rekomendasi server aplikasi dan kerangka kerja aplikasi yang digunakan"
        verifiabilitas: otomatis
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V14.1", "CWE-16" ]
        metode_pengujian:
          - id: CONF-13.1-T01
            nama: Banner server tidak mengungkap versi
            titik_uji: global
            check_id: headers.server_banner
            kriteria_lulus: Header Server/X-Powered-By tidak menampilkan produk dan versi detail.
          - id: CONF-13.1-T02
            nama: Directory listing dinonaktifkan
            titik_uji: global
            engine: zap
            check_id: conf.directory_listing
            kriteria_lulus: Tidak ada direktori yang menampilkan daftar isi.
          - id: CONF-13.1-T03
            nama: Mode debug kerangka kerja nonaktif
            titik_uji: global
            engine: nuclei
            check_id: conf.debug_mode
            kriteria_lulus: Tidak ada halaman/endpoint debug kerangka kerja yang aktif.

      - id: CONF-13.2
        nomor_referensi: "13.2"
        uraian: "mendokumentasi, menyalin konfigurasi, dan semua dependensi"
        verifiabilitas: manual
        severity_default: rendah
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V14.2.5" ]
        metode_pengujian:
          - id: CONF-13.2-T01
            nama: Dokumentasi konfigurasi dan daftar dependensi (SBOM)
            titik_uji: dokumen
            jenis: manual
            engine: manual
            check_id: manual.config_documentation
            kriteria_lulus: Konfigurasi dan dependensi terdokumentasi dan dicadangkan.
            bukti: [ dokumen ]

      - id: CONF-13.3
        nomor_referensi: "13.3"
        uraian: "menghapus fitur, dokumentasi, sampel, dan konfigurasi yang tidak diperlukan"
        verifiabilitas: otomatis
        severity_default: tinggi
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V14.3", "CWE-1188" ]
        metode_pengujian:
          - id: CONF-13.3-T01
            nama: Halaman default/sampel/dokumentasi server tidak tersedia
            titik_uji: global
            engine: nuclei
            check_id: exposure.default_sample_pages
            kriteria_lulus: Tidak ada halaman instalasi, sampel, atau dokumentasi bawaan.
          - id: CONF-13.3-T02
            nama: Berkas konfigurasi dan repositori tidak terekspos
            titik_uji: global
            engine: nuclei
            check_id: exposure.config_vcs_files
            kriteria_lulus: Berkas seperti .env, .git, dan konfigurasi tidak dapat diakses.

      - id: CONF-13.4
        nomor_referensi: "13.4"
        uraian: "memvalidasi integritas aset jika aset aplikasi diakses secara eksternal"
        verifiabilitas: otomatis
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V14.2.3", "CWE-829" ]
        metode_pengujian:
          - id: CONF-13.4-T01
            nama: Subresource Integrity pada aset dari CDN/eksternal
            titik_uji: global
            check_id: integrity.sri
            kriteria_lulus: Seluruh aset eksternal memiliki atribut integrity yang valid.

      - id: CONF-13.5
        nomor_referensi: "13.5"
        uraian: "menggunakan respons aplikasi dan konten yang aman"
        verifiabilitas: otomatis
        severity_default: sedang
        agregasi: semua_lulus
        referensi_pendukung: [ "OWASP ASVS V14.4" ]
        metode_pengujian:
          - id: CONF-13.5-T01
            nama: Header keamanan respons
            titik_uji: global
            check_id: headers.security_baseline
            kriteria_lulus: X-Content-Type-Options, perlindungan framing (X-Frame-Options/CSP frame-ancestors), dan Referrer-Policy ada.
          - id: CONF-13.5-T02
            nama: Content-Type dan charset tepat
            titik_uji: global
            check_id: headers.content_type_charset
            kriteria_lulus: Setiap respons memiliki Content-Type yang benar beserta charset.
